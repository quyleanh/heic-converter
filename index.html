<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Private browser-only HEIC/HEIF to JPEG/PNG converter"><title>HEIC Converter</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>HEIC Converter</h1><p>Convert HEIC/HEIF to JPEG or PNG. Your images stay on your device.</p></header><section id="drop" tabindex="0"><strong>Drop HEIC / HEIF files here</strong><span>or</span><label class="btn">Browse<input id="files" type="file" accept=".heic,.heif,image/heic,image/heif" multiple hidden></label></section><section class="controls"><label>Output <select id="format"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option></select></label><label id="quality-row">JPEG quality <input id="quality" type="range" min="50" max="100" value="90"><b id="q">90%</b></label></section><div id="status" role="status"></div><section id="results"></section><footer>🔒 Local processing • no upload endpoint • powered by libheif/WASM</footer></main><script type="module" src="app.js"></script></body></html>
